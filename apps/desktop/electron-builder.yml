appId: org.earthstories.desktop
productName: Earth Stories
artifactName: earth-stories-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: build/artifacts
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build/resources
    to: .
    filter:
      - "**/*"
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  identity: null
  notarize: false
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Graphics
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
publish: null
