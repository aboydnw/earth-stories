appId: org.earthstories.desktop
productName: Earth Stories
artifactName: earth-stories-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: build/artifacts
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build/resources
    to: .
    filter:
      - "**/*"
mac:
  executableName: earth-stories
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The pilot ships deliberately unsigned and un-notarized: testers bypass
  # Gatekeeper by hand and are told so. These two lines are what change once a
  # Developer ID and notarization credentials exist.
  identity: null
  notarize: false
win:
  executableName: earth-stories
  target:
    - target: nsis
      arch:
        - x64
linux:
  executableName: earth-stories
  maintainer: Earth Stories contributors
  syncDesktopName: true
  category: Graphics
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
publish: null
