[workspace]
name = "earth-stories-conversion"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
pydantic = ">=2.11,<3"

[feature.contracts.dependencies]
datamodel-code-generator = ">=0.32,<1"

[feature.vector.dependencies]
duckdb = ">=1.3,<2"
gdal = ">=3.10,<4"
libgdal-arrow-parquet = ">=3.10,<4"
pyarrow = ">=20,<23"

[feature.raster.dependencies]
gdal = ">=3.10,<4"
rasterio = ">=1.4,<2"
rio-cogeo = ">=5.4,<6"

[feature.multidim.dependencies]
gdal = ">=3.10,<4"
xarray = ">=2025.6,<2027"
netcdf4 = ">=1.7,<2"
h5netcdf = ">=1.6,<2"
zarr = ">=3.0,<4"
rasterio = ">=1.4,<2"
rio-cogeo = ">=5.4,<6"
rioxarray = ">=0.19,<1"

[feature.pointcloud.dependencies]
pdal = ">=2.9,<3"
python-pdal = ">=3.5,<4"

[environments]
core = { solve-group = "core" }
contracts = { features = ["contracts"], solve-group = "contracts" }
vector = { features = ["vector"], solve-group = "vector" }
raster = { features = ["raster"], solve-group = "raster" }
multidim = { features = ["multidim"], solve-group = "multidim" }
pointcloud = { features = ["pointcloud"], solve-group = "pointcloud" }
