name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conversion-lock:
    name: Conversion lock (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: macos-x64
            runner: macos-13
          - platform: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install checksum-verified Pixi
        run: node scripts/install-pixi.mjs .earth-stories/bin/pixi
      - name: Validate conversion lock
        run: .earth-stories/bin/pixi lock --check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Verify generated conversion contracts
        run: |
          node scripts/install-pixi.mjs .earth-stories/bin/pixi
          yarn contract:generate
          .earth-stories/bin/pixi install -e contracts
          .earth-stories/bin/pixi run -e contracts datamodel-codegen --input conversion/schema/conversion-v1.schema.json --input-file-type jsonschema --output conversion/worker/models.py --output-model-type pydantic_v2.BaseModel --target-python-version 3.12 --use-standard-collections --use-union-operator --disable-timestamp
          git diff --exit-code -- conversion/schema/conversion-v1.schema.json conversion/worker/models.py
      - run: yarn check:independence
      - run: yarn check:ui
      - run: yarn format:check
      - name: Verify clean-checkout viewer bootstrap
        run: yarn clean:types && yarn workspace @earth-stories/viewer-app build
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn storybook:build
      - run: yarn build:publication
      - name: Check publication contents
        run: test -f dist/publications/field-notes/publication.json && test -f dist/publications/field-notes/assets/survey-sites.geojson
