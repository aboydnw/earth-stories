name: Claude Review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@claude review'))
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Use `gh pr view` and `gh pr diff` to understand the change and its intent.
            Read AGENTS.md (and CLAUDE.md, if present) first: they define this project's
            conventions, and violations of them are review findings.

            Focus on, in order:
            - Correctness bugs and regressions
            - Security issues (auth, secrets, untrusted input)
            - Missing or weak tests for changed behavior
            - Simplifications that would meaningfully reduce complexity

            Skip style nits that a formatter or linter would catch.
            Post specific issues as inline comments on the relevant lines.
            Finish with one short top-level summary via `gh pr comment`: a verdict
            (ready to merge / needs changes) and the findings ranked by severity.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
